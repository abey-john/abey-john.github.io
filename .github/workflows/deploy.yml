name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Optional daily rebuild at 12:00 UTC to sync Notion updates automatically
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run check

      - name: Check placeholders (strict)
        run: npm run check:placeholders -- --strict

      - name: Check EXIF metadata
        run: npm run check:exif

      - name: Cache Notion route geometries
        uses: actions/cache@v4
        with:
          path: src/assets/notion/routes
          key: notion-routes-${{ runner.os }}
          restore-keys: |
            notion-routes-${{ runner.os }}

      - name: Restore music preview cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/music-previews
          key: music-previews-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            music-previews-${{ runner.os }}-

      - name: Restore timeline cover cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/timeline-covers
          key: timeline-covers-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            timeline-covers-${{ runner.os }}-

      - name: Build static site with Notion data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_SETTINGS_DB_ID: ${{ secrets.NOTION_SETTINGS_DB_ID }}
          NOTION_ABOUT_PAGE_ID: ${{ secrets.NOTION_ABOUT_PAGE_ID }}
          NOTION_NOW_DB_ID: ${{ secrets.NOTION_NOW_DB_ID }}
          NOTION_LAUNCHES_DB_ID: ${{ secrets.NOTION_LAUNCHES_DB_ID }}
          NOTION_MUSIC_DB_ID: ${{ secrets.NOTION_MUSIC_DB_ID }}
          NOTION_PLACES_DB_ID: ${{ secrets.NOTION_PLACES_DB_ID }}
          NOTION_TRIPS_DB_ID: ${{ secrets.NOTION_TRIPS_DB_ID }}
          PREVIEW_RESOLVE_LIMIT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '80' || '10' }}
          PREVIEW_RESOLVE_BUDGET_MS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '180000' || '18000' }}
          PREVIEW_REQUEST_DELAY_MS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '2600' || '1500' }}
          PREVIEW_APPLE_WEB_DELAY_MS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '500' || '450' }}
        run: npm run build

      - name: Check if music preview cache updated
        id: check_preview_cache
        run: |
          if [ -f node_modules/.cache/music-previews/.dirty ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save music preview cache
        if: steps.check_preview_cache.outputs.dirty == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/music-previews
          key: music-previews-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check if timeline cover cache updated
        id: check_timeline_covers
        run: |
          if [ -f node_modules/.cache/timeline-covers/.dirty ]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save timeline cover cache
        if: steps.check_timeline_covers.outputs.dirty == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/timeline-covers
          key: timeline-covers-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
